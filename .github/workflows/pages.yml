name: Demo site

# Publishes the settings page demos (build/demo.py) to GitHub Pages whenever a page, the kit or the demo changes.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'ui/**'
      - 'demo/**'
      - 'assets/**'
      - 'build/demo.py'
      - 'README.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Build the demo site
        run: python3 build/demo.py --out _site --fetch-fonts
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
