name: Release

# Push a tag starting with "v" (for example v1.0.0), or run this workflow from
# the Actions tab and enter a tag name. Every plugin whose meta.json version is
# not yet in manifest.json is built, attached to a GitHub release for that tag
# and added to manifest.json on main.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create on main, for example v1.0.0
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check tag
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag must look like v1.2.3, got: $TAG"
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build workflow passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          result=$(gh run list --workflow build.yml --commit "$sha" --event push --json status,conclusion \
            --jq '.[0] | "\(.status) \(.conclusion)"')
          if [ "$result" != "completed success" ]; then
            echo "The Build workflow on main ($sha) is '$result', not green. Release only from a green main."
            exit 1
          fi
      - name: Release gates
        run: |
          python3 build/checks.py
          python3 build/package.py --check
      - name: Package new plugin versions
        run: python3 build/package.py --tag "$TAG" --repo "$GITHUB_REPOSITORY"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s dist/files.txt ]; then
            echo "No new plugin versions to release."
            exit 0
          fi
          gh release create "$TAG" --target main --title "$TAG" --generate-notes $(cat dist/files.txt)
      - name: Update manifest.json on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "Update manifest for $TAG"
          git push origin HEAD:main
