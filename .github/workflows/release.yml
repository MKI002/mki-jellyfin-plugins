name: Release

# Push a tag starting with "v" (for example v1.0.0) on main. Every plugin whose
# meta.json version is not yet in manifest.json is built, attached to a GitHub
# release for that tag and added to manifest.json on main.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Package new plugin versions
        run: python3 build/package.py --tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s dist/files.txt ]; then
            echo "No new plugin versions to release."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes $(cat dist/files.txt)
      - name: Update manifest.json on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "Update manifest for $GITHUB_REF_NAME"
          git push origin HEAD:main
